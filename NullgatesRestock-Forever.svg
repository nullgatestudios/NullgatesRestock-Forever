<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Restock - Forever: a coin pouch inside a circle of restock arrows -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#f2c740"/>
      <stop offset="1" stop-color="#a87412"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b88250"/>
      <stop offset="1" stop-color="#6a3e1c"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe2ff"/>
      <stop offset="1" stop-color="#2f8ad6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="256" cy="262" r="190" fill="url(#shine)"/>

  <!-- restock arrows: two arcs chasing each other around the pouch -->
  <g fill="none" stroke-linecap="round">
    <path d="M118 210 A150 150 0 0 1 362 142" stroke="#4fb4ff" stroke-width="30" opacity="0.4" filter="url(#glow)"/>
    <path d="M394 314 A150 150 0 0 1 150 382" stroke="#4fb4ff" stroke-width="30" opacity="0.4" filter="url(#glow)"/>
    <path d="M118 210 A150 150 0 0 1 362 142" stroke="url(#arrow)" stroke-width="22"/>
    <path d="M394 314 A150 150 0 0 1 150 382" stroke="url(#arrow)" stroke-width="22"/>
  </g>
  <path d="M340 104 L404 148 L336 178 Z" fill="#7cc8ff" stroke="#d7f3ff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M172 420 L108 376 L176 346 Z" fill="#3b95dc" stroke="#d7f3ff" stroke-width="4" stroke-linejoin="round"/>

  <!-- coin pouch -->
  <ellipse cx="256" cy="380" rx="92" ry="14" fill="#000000" opacity="0.35"/>
  <path d="M222 196 C206 214 214 226 226 230 C172 250 160 300 168 334 C176 368 214 378 256 378 C298 378 336 368 344 334 C352 300 340 250 286 230 C298 226 306 214 290 196 Z" fill="#c98a4c" opacity="0.4" filter="url(#glow)"/>
  <path d="M222 196 C206 214 214 226 226 230 C172 250 160 300 168 334 C176 368 214 378 256 378 C298 378 336 368 344 334 C352 300 340 250 286 230 C298 226 306 214 290 196 Z" fill="url(#leather)" stroke="#3e2410" stroke-width="5" stroke-linejoin="round"/>
  <!-- tie -->
  <path d="M220 230 Q256 244 292 230" fill="none" stroke="#f0d27a" stroke-width="9" stroke-linecap="round"/>
  <path d="M256 238 q-22 18 -30 34 M256 238 q22 18 30 34" fill="none" stroke="#f0d27a" stroke-width="6" stroke-linecap="round"/>
  <path d="M196 290 Q192 320 206 344" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round"/>

  <!-- coins spilling out the top and front -->
  <g stroke="#7a5410" stroke-width="4">
    <ellipse cx="244" cy="190" rx="26" ry="11" fill="url(#coin)"/>
    <ellipse cx="270" cy="178" rx="26" ry="11" fill="url(#coin)"/>
    <circle cx="300" cy="336" r="30" fill="url(#coin)"/>
    <circle cx="246" cy="350" r="24" fill="url(#coin)"/>
  </g>
  <circle cx="300" cy="336" r="18" fill="none" stroke="#a87412" stroke-width="3"/>
  <circle cx="246" cy="350" r="14" fill="none" stroke="#a87412" stroke-width="3"/>
  <path d="M290 322 q6 -6 14 -4" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M256 70 l8 21 l21 8 l-21 8 l-8 21 l-8 -21 l-21 -8 l21 -8 Z" fill="#fff0a8"/>
  <path d="M420 400 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#ffd76a"/>
  <circle cx="98" cy="120" r="6" fill="#fff0a8"/>
</svg>
